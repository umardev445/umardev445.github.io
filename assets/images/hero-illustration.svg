<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400" role="img" aria-label="Online Quran Learning Platform Illustration">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F0" />
      <stop offset="100%" stop-color="#EBF4F3" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#0B5F59" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0B1F33" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Card Container -->
  <rect x="20" y="20" width="480" height="360" rx="24" fill="url(#heroBg)" stroke="#DCE5E4" stroke-width="2" />

  <!-- Background Decorative Rays/Nodes -->
  <circle cx="260" cy="180" r="140" fill="none" stroke="#0F766E" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="260" cy="180" r="180" fill="none" stroke="#C8A96B" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Main Virtual Classroom Interface -->
  <g filter="url(#shadow)" transform="translate(70, 60)">
    <rect width="380" height="240" rx="16" fill="#FFFFFF" stroke="#DCE5E4" stroke-width="2"/>
    
    <!-- Top App Header -->
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 364 0 C 372.84 0 380 7.16 380 16 L 380 40 L 0 40 Z" fill="#0B1F33"/>
    
    <!-- Window Controls -->
    <circle cx="20" cy="20" r="5" fill="#EF4444"/>
    <circle cx="36" cy="20" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="20" r="5" fill="#10B981"/>

    <!-- Lesson Title Bar inside video call -->
    <rect x="76" y="12" width="228" height="16" rx="8" fill="rgba(255,255,255,0.15)"/>
    <text x="190" y="24" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#FAF7F0" text-anchor="middle">Live 1-on-1 Quran Lesson • Tajweed &amp; Recitation</text>

    <!-- Student & Tutor Dual View Boxes -->
    <rect x="20" y="56" width="160" height="120" rx="12" fill="#FAF7F0" stroke="#0F766E" stroke-width="1.5"/>
    <!-- Tutor Side Placeholder Icon -->
    <circle cx="100" cy="100" r="28" fill="#0F766E" opacity="0.15"/>
    <path d="M 86 108 C 86 96 114 96 114 108" stroke="#0F766E" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="100" cy="92" r="10" fill="#0F766E"/>
    <rect x="30" y="152" width="80" height="16" rx="8" fill="#0F766E"/>
    <text x="70" y="163" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">Quran Tutor</text>

    <rect x="200" y="56" width="160" height="120" rx="12" fill="#FAF7F0" stroke="#0B1F33" stroke-width="1.5"/>
    <!-- Student Side Placeholder Icon -->
    <circle cx="280" cy="100" r="28" fill="#0B1F33" opacity="0.15"/>
    <path d="M 266 108 C 266 96 294 96 294 108" stroke="#0B1F33" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="280" cy="92" r="10" fill="#0B1F33"/>
    <rect x="210" y="152" width="80" height="16" rx="8" fill="#0B1F33"/>
    <text x="250" y="163" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">Student (US)</text>

    <!-- Bottom Audio/Video Toolbar -->
    <rect x="20" y="190" width="340" height="38" rx="8" fill="#FAF7F0"/>
    <circle cx="150" cy="209" r="12" fill="#0F766E"/>
    <path d="M 145 209 L 155 209 M 150 204 L 150 214" stroke="#FFF" stroke-width="2"/>
    <circle cx="190" cy="209" r="12" fill="#0B1F33"/>
    <rect x="184" y="205" width="12" height="8" rx="2" fill="#FFF"/>
    <circle cx="230" cy="209" r="12" fill="#C8A96B"/>
  </g>

  <!-- Open Quran Book Floating Badge -->
  <g filter="url(#shadow)" transform="translate(30, 220)">
    <rect width="110" height="70" rx="12" fill="#FFFFFF" stroke="#C8A96B" stroke-width="2"/>
    <path d="M 20 42 C 32 36, 48 38, 55 44 L 55 20 C 48 16, 32 14, 20 20 Z" fill="url(#emeraldGrad)"/>
    <path d="M 90 42 C 78 36, 62 38, 55 44 L 55 20 C 62 16, 78 14, 90 20 Z" fill="#0B1F33"/>
    <text x="55" y="58" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#0B1F33" text-anchor="middle">One-to-One</text>
  </g>

  <!-- US Timezone Flexible Badge -->
  <g filter="url(#shadow)" transform="translate(370, 240)">
    <rect width="120" height="65" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
    <circle cx="30" cy="32" r="14" fill="#0F766E" opacity="0.1"/>
    <path d="M 30 22 L 30 32 L 36 36" stroke="#0F766E" stroke-width="2" stroke-linecap="round"/>
    <text x="54" y="28" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#0B1F33">US Timings</text>
    <text x="54" y="42" font-family="Inter, sans-serif" font-size="8" font-weight="600" fill="#5E6B73">EST / CST / PST</text>
  </g>
</svg>
