<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">A useful parent progress note</title><desc id="desc">Illustrative sample — not an actual child’s record or promised result.</desc><rect width="1200" height="800" fill="#f5faf7"/><g font-family="Arial, DejaVu Sans, sans-serif"><text x="64" y="82" font-size="22" fill="#53645f" >QURANCREST · LEARNING LIBRARY</text><text x="64" y="146" font-size="43" fill="#0b4d3b" >A useful parent progress note</text><text x="64" y="193" font-size="25" fill="#53645f" >Illustrative sample — not an actual child’s record or promised result.</text><rect x="64" y="235" width="1072" height="477" rx="24" fill="#fff" stroke="#dbe6e1" stroke-width="2"/><text x="97" y="287" font-size="22" fill="#53645f" >TODAY’S TASK</text><text x="97" y="329" font-size="30" fill="#0b4d3b" >Read a small set of joined letter patterns.</text><text x="97" y="391" font-size="22" fill="#53645f" >WHAT IMPROVED</text><text x="97" y="433" font-size="30" fill="#0b4d3b" >Two patterns needed fewer prompts.</text><text x="97" y="495" font-size="22" fill="#53645f" >NEXT CORRECTION</text><text x="97" y="537" font-size="30" fill="#0b4d3b" >Check dots before reading the form.</text><text x="97" y="599" font-size="22" fill="#53645f" >HOME PRACTICE</text><text x="97" y="641" font-size="30" fill="#0b4d3b" >Repeat the selected line; note the difficult pattern.</text><text x="64" y="762" font-size="21" fill="#53645f" >qurancrest.com · Practical guidance, with teacher-led correction</text></g></svg>