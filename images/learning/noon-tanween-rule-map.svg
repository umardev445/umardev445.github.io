<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Noon sakinah &amp; tanween: four rules</title><desc id="desc">Connected reading: identify the next letter, then hear the correct model.</desc><rect width="1200" height="900" fill="#f5faf7"/><g font-family="Arial, DejaVu Sans, sans-serif"><text x="64" y="82" font-size="22" fill="#53645f" >QURANCREST · LEARNING LIBRARY</text><text x="64" y="146" font-size="43" fill="#0b4d3b" >Noon sakinah &amp; tanween: four rules</text><text x="64" y="193" font-size="25" fill="#53645f" >Connected reading: identify the next letter, then hear the correct model.</text><rect x="64" y="240" width="520" height="224" rx="24" fill="#fff" stroke="#dbe6e1" stroke-width="2"/><text x="92" y="289" font-size="34" fill="#0b4d3b" >Izhar</text><text x="324" y="359" font-size="44" fill="#0b4d3b" text-anchor="middle" direction="rtl" lang="ar" font-family="DejaVu Sans, Arial, sans-serif">ء ه ع ح غ خ</text><text x="92" y="430" font-size="22" fill="#53645f" >Read the noon clearly.</text><rect x="616" y="240" width="520" height="224" rx="24" fill="#fff" stroke="#dbe6e1" stroke-width="2"/><text x="644" y="289" font-size="34" fill="#0b4d3b" >Idgham</text><text x="876" y="359" font-size="44" fill="#0b4d3b" text-anchor="middle" direction="rtl" lang="ar" font-family="DejaVu Sans, Arial, sans-serif">ي ر م ل و ن</text><text x="644" y="430" font-size="22" fill="#53645f" >Learn both merging groups and exceptions.</text><rect x="64" y="492" width="520" height="224" rx="24" fill="#fff" stroke="#dbe6e1" stroke-width="2"/><text x="92" y="541" font-size="34" fill="#0b4d3b" >Iqlab</text><text x="324" y="611" font-size="44" fill="#0b4d3b" text-anchor="middle" direction="rtl" lang="ar" font-family="DejaVu Sans, Arial, sans-serif">ب</text><text x="92" y="682" font-size="22" fill="#53645f" >A meem-like sound with ghunnah.</text><rect x="616" y="492" width="520" height="224" rx="24" fill="#fff" stroke="#dbe6e1" stroke-width="2"/><text x="644" y="541" font-size="34" fill="#0b4d3b" >Ikhfa</text><text x="876" y="593" font-size="34" fill="#0b4d3b" text-anchor="middle" direction="rtl" lang="ar" font-family="DejaVu Sans, Arial, sans-serif">ت ث ج د ذ ز س ش</text><text x="876" y="638" font-size="34" fill="#0b4d3b" text-anchor="middle" direction="rtl" lang="ar" font-family="DejaVu Sans, Arial, sans-serif">ص ض ط ظ ف ق ك</text><text x="644" y="682" font-size="22" fill="#53645f" >Concealment with ghunnah.</text><text x="64" y="785" font-size="25" fill="#0b4d3b" >Idgham: ي ن م و with ghunnah; ل ر without ghunnah.</text><text x="64" y="824" font-size="24" fill="#53645f" >Use the full guide for referenced examples; a chart cannot check your sound.</text><text x="64" y="862" font-size="21" fill="#53645f" >qurancrest.com · Practical guidance, with teacher-led correction</text></g></svg>