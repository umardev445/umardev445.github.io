<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Natural madd: distinguish the long vowel</title><desc id="desc">Introductory natural madd is two counts at the pace of recitation.</desc><rect width="1200" height="800" fill="#f5faf7"/><g font-family="Arial, DejaVu Sans, sans-serif"><text x="64" y="82" font-size="22" fill="#53645f" >QURANCREST · LEARNING LIBRARY</text><text x="64" y="146" font-size="43" fill="#0b4d3b" >Natural madd: distinguish the long vowel</text><text x="64" y="193" font-size="25" fill="#53645f" >Introductory natural madd is two counts at the pace of recitation.</text><rect x="64" y="239" width="336" height="350" rx="24" fill="#fff" stroke="#dbe6e1" stroke-width="2"/><text x="232" y="380" font-size="101" fill="#0b4d3b" text-anchor="middle" direction="rtl" lang="ar" font-family="DejaVu Sans, Arial, sans-serif">بَا</text><text x="232" y="454" font-size="25" fill="#0b4d3b" text-anchor="middle">Alif after fathah</text><circle cx="195" cy="520" r="17" fill="#d6a84b"/><circle cx="269" cy="520" r="17" fill="#d6a84b"/><rect x="432" y="239" width="336" height="350" rx="24" fill="#fff" stroke="#dbe6e1" stroke-width="2"/><text x="600" y="380" font-size="101" fill="#0b4d3b" text-anchor="middle" direction="rtl" lang="ar" font-family="DejaVu Sans, Arial, sans-serif">بُو</text><text x="600" y="454" font-size="25" fill="#0b4d3b" text-anchor="middle">Waw after dammah</text><circle cx="563" cy="520" r="17" fill="#d6a84b"/><circle cx="637" cy="520" r="17" fill="#d6a84b"/><rect x="800" y="239" width="336" height="350" rx="24" fill="#fff" stroke="#dbe6e1" stroke-width="2"/><text x="968" y="380" font-size="101" fill="#0b4d3b" text-anchor="middle" direction="rtl" lang="ar" font-family="DejaVu Sans, Arial, sans-serif">بِي</text><text x="968" y="454" font-size="25" fill="#0b4d3b" text-anchor="middle">Ya after kasrah</text><circle cx="931" cy="520" r="17" fill="#d6a84b"/><circle cx="1005" cy="520" r="17" fill="#d6a84b"/><rect x="64" y="621" width="1072" height="92" rx="24" fill="#fffaf0" stroke="#dbe6e1" stroke-width="2"/><text x="88" y="659" font-size="28" fill="#0b4d3b" >Teaching patterns only. Secondary madd has additional conditions.</text><text x="88" y="696" font-size="25" fill="#53645f" >Follow the agreed reading tradition and your teacher’s model.</text><text x="64" y="762" font-size="21" fill="#53645f" >qurancrest.com · Practical guidance, with teacher-led correction</text></g></svg>