<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">One letter, three short vowels</title><desc id="desc">Teacher-guided exercise: listen, read, then change the order.</desc><rect width="1200" height="800" fill="#f5faf7"/><g font-family="Arial, DejaVu Sans, sans-serif"><text x="64" y="82" font-size="22" fill="#53645f" >QURANCREST · LEARNING LIBRARY</text><text x="64" y="146" font-size="43" fill="#0b4d3b" >One letter, three short vowels</text><text x="64" y="193" font-size="25" fill="#53645f" >Teacher-guided exercise: listen, read, then change the order.</text><rect x="64" y="239" width="336" height="330" rx="24" fill="#fff" stroke="#dbe6e1" stroke-width="2"/><text x="232" y="389" font-size="112" fill="#0b4d3b" text-anchor="middle" direction="rtl" lang="ar" font-family="DejaVu Sans, Arial, sans-serif">بَ</text><text x="232" y="464" font-size="32" fill="#0b4d3b" text-anchor="middle">Fathah</text><text x="232" y="517" font-size="25" fill="#53645f" text-anchor="middle">Short a sound</text><rect x="432" y="239" width="336" height="330" rx="24" fill="#fff" stroke="#dbe6e1" stroke-width="2"/><text x="600" y="389" font-size="112" fill="#0b4d3b" text-anchor="middle" direction="rtl" lang="ar" font-family="DejaVu Sans, Arial, sans-serif">بِ</text><text x="600" y="464" font-size="32" fill="#0b4d3b" text-anchor="middle">Kasrah</text><text x="600" y="517" font-size="25" fill="#53645f" text-anchor="middle">Short i sound</text><rect x="800" y="239" width="336" height="330" rx="24" fill="#fff" stroke="#dbe6e1" stroke-width="2"/><text x="968" y="389" font-size="112" fill="#0b4d3b" text-anchor="middle" direction="rtl" lang="ar" font-family="DejaVu Sans, Arial, sans-serif">بُ</text><text x="968" y="464" font-size="32" fill="#0b4d3b" text-anchor="middle">Dammah</text><text x="968" y="517" font-size="25" fill="#53645f" text-anchor="middle">Short u sound</text><rect x="64" y="605" width="1072" h